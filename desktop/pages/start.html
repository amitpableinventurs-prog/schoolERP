<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<title>Smart Campus ERP</title>
<style>
  :root { --accent: #4f46e5; --bg: #f6f7fb; --card: #fff; --text: #1d2033; --muted: #6b7088; --bad: #b42318; --bad-soft: #fde8e7; --border: #dfe2ec; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11131c; --card: #1a1d29; --text: #eef0f7; --muted: #9aa0b8; --bad: #ff8a80; --bad-soft: #3a1d1d; --border: #2c3042; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
  .card { width: 420px; max-width: calc(100vw - 32px); background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; box-shadow: 0 10px 40px rgba(0,0,0,.08); }
  .logo { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 20px; background: linear-gradient(135deg, #4f46e5, #7c3aed); }
  h1 { font-size: 20px; margin: 14px 0 4px; }
  p { color: var(--muted); margin: 0 0 18px; }
  label { display: block; font-weight: 600; margin: 12px 0 6px; }
  input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: inherit; font: inherit; }
  input.key { font: 600 18px Consolas, monospace; letter-spacing: 1px; text-transform: uppercase; }
  button { margin-top: 18px; width: 100%; padding: 11px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: 600 15px inherit; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .error { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
  .ok { color: #12805c; font-weight: 600; margin-top: 12px; }
  details { margin-top: 12px; color: var(--muted); }
  .spinner { width: 34px; height: 34px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; margin: 22px auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .center { text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="card" id="activate" hidden>
    <div class="logo">SC</div>
    <h1>Activate Smart Campus ERP</h1>
    <p>Enter the activation key from your service provider. This is needed once, with internet.</p>
    <form id="form">
      <label for="key">Activation key</label>
      <input id="key" class="key" placeholder="SC-XXXX-XXXX-XXXX" autocomplete="off" required>
      <details>
        <summary>Server address</summary>
        <input id="url" placeholder="https://app.example.com">
      </details>
      <div class="error" id="error" hidden></div>
      <div class="ok" id="ok" hidden></div>
      <button id="go">Activate</button>
    </form>
  </div>
  <div class="card center" id="loading" hidden>
    <div class="logo" style="margin: 0 auto">SC</div>
    <h1>Smart Campus ERP</h1>
    <div class="spinner"></div>
    <p id="status">Starting…</p>
    <div class="error" id="loadError" hidden></div>
    <button id="changeKey" type="button" hidden>Use a different key</button>
  </div>
  <script src="start.js"></script>
</body>
</html>
